[package]
name = "thumb-viewer-shell"
version = "0.1.0"
edition = "2021"

[lib]
name = "thumb_viewer"
crate-type = ["cdylib"]

[dependencies]
thumb-viewer-core = { path = "../core" }
log = "0.4"

# windows-core must be a direct dep so that the #[implement] macro can resolve
# ::windows_core paths it generates.
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
]

[[test]]
name = "com_smoke_test"
path = "tests/com_smoke_test.rs"
